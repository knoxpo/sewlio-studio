name: studio
description: Sewlio Studio — Flutter application shell (skeleton).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  studio_canvas:
    path: ../../packages/studio_canvas
  studio_commands:
    path: ../../packages/studio_commands
  studio_core:
    path: ../../packages/studio_core
  studio_design_system:
    path: ../../packages/studio_design_system
  studio_diagnostics:
    path: ../../packages/studio_diagnostics
  studio_document:
    path: ../../packages/studio_document
  studio_embroidery:
    path: ../../packages/studio_embroidery
  studio_events:
    path: ../../packages/studio_events
  studio_export:
    path: ../../packages/studio_export
  studio_geometry:
    path: ../../packages/studio_geometry
  studio_import:
    path: ../../packages/studio_import
  studio_machine:
    path: ../../packages/studio_machine
  studio_simulation:
    path: ../../packages/studio_simulation
  studio_tools:
    path: ../../packages/studio_tools

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
