name: sewlio_studio_workspace
description: Pub workspace root for Sewlio Studio (MVP Flutter/Dart packages).
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - apps/studio
  - packages/studio_bindings
  - packages/studio_design_system
  - packages/studio_commands
  - packages/studio_core
  - packages/studio_diagnostics
  - packages/studio_document
  - packages/studio_embroidery
  - packages/studio_events
  - packages/studio_geometry
  - packages/studio_machine
